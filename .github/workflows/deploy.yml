# Builds the site and publishes it on GitHub Pages every time main is pushed.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site address: https://genos-x15.github.io/indigenous-website/
      # With a custom domain, set NEXT_PUBLIC_BASE_PATH to "" and NEXT_PUBLIC_SITE_URL to the domain.
      NEXT_PUBLIC_BASE_PATH: /indigenous-website
      NEXT_PUBLIC_SITE_URL: https://genos-x15.github.io/indigenous-website
      # Staff admin panel opened by the "Open the admin panel" button on /staff/.
      NEXT_PUBLIC_ADMIN_URL: https://goat-app-5869.vercel.app/login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
